name: Build encounter playback media
on:
  workflow_dispatch:
  push:
    paths:
      - 'game/Video/Bayra/*.mp4'
      - 'game/Video/anu/*.mp4'
      - 'game/Video/deeremchin/*.webm'
      - 'game/Video/ganba/*.webm'
      - 'game/Video/ganzo/*.webm'
      - 'tools/prepare_transition_frames.py'
      - 'game/deeremchin.rpy'
      - 'game/ganba.rpy'
      - 'game/ganzo.rpy'
      - 'tools/encounter_media.json'
      - 'tools/prepare_encounter_media.py'
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install FFmpeg and load source videos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          git lfs install --local
          git lfs pull --include='game/Video/**/*.webm,game/Video/Bayra/*.mp4,game/Video/anu/*.mp4'
      - name: Convert playback videos and extract stills
        run: |
          python3 tools/prepare_encounter_media.py
          python3 tools/prepare_transition_frames.py --audit
      - name: Commit playback assets through Git LFS
        run: |
          git add -- game/Video/Bayra/*.webm game/Video/anu/*.webm game/images/Bayra/frames/*.jpg game/images/anu/frames/*.jpg
          git add -- game/images/transitions game/images/encounter-media-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build encounter playback assets'
          git push origin HEAD
