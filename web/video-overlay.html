<div id="shelter-video" hidden>
  <div id="video-stage">
    <video id="story-video" playsinline webkit-playsinline preload="metadata" disablepictureinpicture></video>
    <img id="video-end-frame" hidden alt="">
    <div id="video-caption" hidden><span id="caption-speaker"></span><span id="caption-words"></span></div>
    <button id="video-interjection" class="metal" type="button" hidden></button>
    <audio id="video-player-voice" preload="auto"></audio>
    <div id="video-actions" aria-hidden="true"></div>
    <button id="video-guide" class="metal" type="button" aria-label="Тоглоомын заавар" title="Тоглоомын заавар"><img src="shelter-ui/rules.svg" alt=""></button>
    <div id="video-loading" role="status">Ачаалж байна…</div>
    <div id="video-prompt" hidden>
      <p id="video-message"></p>
      <button id="video-resume" class="metal" type="button">Үргэлжлүүлэх</button>
    </div>
    <div id="video-controls">
      <button id="video-pause" class="metal" type="button" aria-label="Түр зогсоох">Ⅱ</button>
      <button id="video-mute" class="metal" type="button" aria-pressed="false">Дуутай</button>
    </div>
    <button id="video-skip" type="button" aria-label="Нэг секунд дарж алгасах">
      <svg class="skip-ring" viewBox="0 0 64 64" aria-hidden="true">
        <circle class="skip-ring-track" cx="32" cy="32" r="27"/>
        <circle class="skip-ring-progress" cx="32" cy="32" r="27" pathLength="100"/>
        <path class="skip-chevrons" d="M22 24L30 32L22 40M33 24L41 32L33 40"/>
      </svg>
      <span id="video-skip-label" hidden>1 СЕК ДАР</span>
    </button>
  </div>
</div>
<div id="rotate-hint"><span aria-hidden="true">↻</span>Утсаа хөндлөн эргүүлж тоглоорой.</div>
<script src="shelter-video.js"></script>
